services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sladkoezhka
      POSTGRES_USER: slad
      POSTGRES_PASSWORD: slad
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on: [db, redis]

  worker:
    build: .
    command: celery -A config worker -l info
    volumes: [".:/app"]
    depends_on: [redis, db]

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["../frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]

volumes: { pgdata: {} }